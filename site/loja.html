<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Big Tricot · Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3ede3; --card:#fffdf9; --ink:#2c2721; --muted:#8a8073; --line:#e4dccf;
    --accent:#9c4a2f; --accent-soft:#b5623f; --ok:#5d7a4a; --chip:#efe7d8;
    --shadow:0 1px 2px rgba(60,48,32,.05),0 8px 24px rgba(60,48,32,.06);
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg); color:var(--ink); font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; -webkit-font-smoothing:antialiased; line-height:1.45}
  .serif{font-family:"Playfair Display",Georgia,serif}
  header.hero{background:linear-gradient(180deg,#efe6d6,#e7dcc9); text-align:center; padding:34px 16px 22px; border-bottom:1px solid var(--line)}
  .brand{font-family:"Playfair Display",serif; font-weight:700; letter-spacing:.14em; font-size:26px}
  .brand small{display:block; letter-spacing:.34em; font-size:10px; font-weight:600; color:var(--muted); margin-top:4px; font-family:Inter,sans-serif}
  .tagline{color:var(--muted); font-size:13px; margin-top:10px}
  .barra{position:sticky; top:0; z-index:30; background:rgba(243,237,227,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; padding:10px 16px; flex-wrap:wrap}
  .busca{flex:1 1 180px; min-width:140px; display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:8px 14px}
  .busca input{border:0; outline:0; background:transparent; width:100%; font-size:14px; color:var(--ink)}
  .regiao{display:flex; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:3px}
  .regiao button{border:0; background:transparent; color:var(--muted); font-weight:600; font-size:12px; padding:6px 12px; border-radius:999px; cursor:pointer}
  .regiao button.on{background:var(--accent); color:#fff}
  .btn-cart{display:flex; align-items:center; gap:7px; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:999px; padding:8px 15px; font-weight:600; font-size:13px; cursor:pointer}
  .btn-cart .n{background:#fff; color:var(--accent); border-radius:999px; min-width:20px; height:20px; display:inline-flex; align-items:center; justify-content:center; font-size:12px; padding:0 5px}
  .abas{display:flex; gap:8px; overflow-x:auto; padding:12px 16px 4px; scrollbar-width:none}
  .abas::-webkit-scrollbar{display:none}
  .abas a{white-space:nowrap; text-decoration:none; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:999px; padding:8px 16px; font-size:13px; font-weight:600; cursor:pointer}
  .abas a.promo{background:var(--accent); color:#fff; border-color:var(--accent)}
  main{max-width:1180px; margin:0 auto; padding:8px 16px 70px}
  .sec{margin-top:30px; scroll-margin-top:120px}
  .sec h2{font-size:26px; margin:0; text-align:center; font-weight:700}
  .sec .sub{text-align:center; color:var(--muted); font-size:12px; letter-spacing:.14em; text-transform:uppercase; margin-top:4px}
  .grade{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:18px; margin-top:20px}
  .prod{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); cursor:pointer; transition:transform .12s ease, box-shadow .12s ease}
  .prod:hover{transform:translateY(-2px); box-shadow:0 2px 4px rgba(60,48,32,.06),0 14px 30px rgba(60,48,32,.1)}
  .foto{position:relative; aspect-ratio:1/1; background:#efe7d8; overflow:hidden}
  .foto img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; z-index:1}
  .foto .ph{position:absolute; inset:0; z-index:0; display:flex; align-items:center; justify-content:center; font-family:"Playfair Display",serif; font-size:30px; color:#c3b49a; letter-spacing:.06em}
  .badge{position:absolute; left:10px; top:10px; font-size:11px; font-weight:600; padding:4px 9px; border-radius:999px; background:rgba(255,253,249,.92); color:var(--ok); display:flex; align-items:center; gap:5px; z-index:2}
  .badge.off{color:var(--muted)}
  .badge .dot{width:7px; height:7px; border-radius:50%; background:currentColor}
  .prod .info{padding:12px 14px 15px}
  .prod .nome{font-weight:600; font-size:15px}
  .preco{margin-top:9px; font-size:13px; color:var(--muted)}
  .preco b{color:var(--accent); font-size:17px; font-family:"Playfair Display",serif}
  .vazio{text-align:center; color:var(--muted); padding:60px 16px}
  /* ---- modal produto (largo, 2 colunas) ---- */
  .modal{position:fixed; inset:0; z-index:60; background:rgba(44,39,33,.55); display:none}
  .modal.show{display:block}
  .sheet{position:absolute; inset:14px; max-width:1180px; margin:0 auto; background:var(--card); border-radius:18px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .sheet .topo{display:flex; justify-content:space-between; align-items:center; padding:12px 18px; border-bottom:1px solid var(--line); flex:0 0 auto}
  .sheet .topo .lb{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:600}
  .sheet .fechar{border:0; background:var(--chip); width:34px; height:34px; border-radius:50%; font-size:16px; cursor:pointer; color:var(--ink)}
  .det{flex:1 1 auto; display:flex; min-height:0}
  .det .lado-foto{flex:1 1 52%; background:#efe7d8; position:relative; overflow:hidden}
  .det .lado-foto img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; z-index:1}
  .det .lado-foto .ph{position:absolute; inset:0; z-index:0; display:flex; align-items:center; justify-content:center; font-family:"Playfair Display",serif; font-size:64px; color:#c3b49a}
  .det .lado-info{flex:1 1 48%; overflow:auto; padding:22px 26px 26px}
  .det .linhalb{text-align:center; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:600; margin-bottom:3px}
  .det .nome{font-size:30px; margin:0 0 14px; font-weight:700; text-align:center}
  .vid{width:100%; border-radius:12px; background:#000; margin-bottom:12px; max-height:300px}
  .comp{text-align:center; color:var(--muted); font-size:13px; letter-spacing:.04em}
  .prazo{display:flex; gap:8px; align-items:center; background:#f6efe3; border:1px solid var(--line); border-radius:12px; padding:10px 14px; font-size:13px; color:var(--ink); margin:14px 0}
  .bloco{margin-top:14px}
  .bloco h5{margin:0 0 5px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
  .bloco ul{margin:0; padding-left:18px; font-size:14px}
  .bloco li{margin:2px 0}
  .montar{margin-top:22px; border-top:1px solid var(--line); padding-top:18px}
  .montar h4{display:flex; align-items:center; gap:8px; font-size:17px; margin:0 0 14px}
  .lbl{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:16px 0 8px}
  .cores{display:flex; flex-wrap:wrap; gap:8px}
  .corchip{display:flex; align-items:center; gap:7px; background:var(--card); border:1.5px solid var(--line); border-radius:999px; padding:4px 13px 4px 5px; font-size:12.5px; cursor:pointer}
  .corchip .sw{width:20px; height:20px; border-radius:50%; border:1px solid rgba(0,0,0,.14)}
  .corchip.on{border-color:var(--accent); background:#fbf3ee}
  .corfoto{margin-top:12px; display:flex; flex-direction:column; align-items:flex-start; gap:6px}
  .corfoto .img{width:150px; height:110px; border-radius:12px; background:#efe7d8; object-fit:cover; border:1px solid var(--line)}
  .corfoto .cap{font-weight:600; font-size:13px}
  .grp{margin-top:16px}
  .grp .t{color:var(--accent); font-weight:600; font-size:14px; margin-bottom:4px}
  .tamrow{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line)}
  .tamrow .med{font-size:14px}
  .tamrow .med small{color:var(--muted); margin-left:6px}
  .tamrow .pr{color:var(--accent); font-weight:600; font-family:"Playfair Display",serif; margin-left:auto; margin-right:10px; white-space:nowrap}
  .stepper{display:flex; align-items:center; gap:0; border:1px solid var(--line); border-radius:999px; overflow:hidden}
  .stepper button{border:0; background:var(--chip); width:30px; height:30px; font-size:17px; cursor:pointer; color:var(--ink)}
  .stepper input{width:40px; border:0; text-align:center; font-size:14px; background:transparent; outline:0; -moz-appearance:textfield}
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
  .addcart{position:sticky; bottom:0; margin-top:18px; width:100%; border:0; background:var(--accent); color:#fff; border-radius:12px; padding:15px; font-size:16px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px}
  .addcart:disabled{background:#cdbfa8; cursor:default}
  @media(max-width:860px){ .det{flex-direction:column; overflow:auto} .det .lado-foto{flex:0 0 auto; aspect-ratio:4/3} .det .lado-info{overflow:visible} .sheet{inset:0; border-radius:0; max-width:none} }
  /* ---- carrinho (gaveta) ---- */
  .cart{position:fixed; inset:0; z-index:70; background:rgba(44,39,33,.5); display:none}
  .cart.show{display:block}
  .cart .pane{position:absolute; top:0; right:0; bottom:0; width:100%; max-width:460px; background:var(--bg); display:flex; flex-direction:column; box-shadow:-10px 0 40px rgba(0,0,0,.2)}
  .cart .ctopo{display:flex; justify-content:space-between; align-items:center; padding:16px 18px; border-bottom:1px solid var(--line); background:var(--card)}
  .cart .ctopo h3{margin:0; font-size:20px}
  .cart .itens{flex:1 1 auto; overflow:auto; padding:10px 16px}
  .citem{display:flex; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:10px}
  .citem .d{flex:1}
  .citem .nm{font-weight:600; font-size:14px}
  .citem .meta{color:var(--muted); font-size:12px; margin-top:1px}
  .citem .l2{display:flex; align-items:center; justify-content:space-between; margin-top:8px}
  .citem .sub{color:var(--accent); font-weight:600; font-family:"Playfair Display",serif}
  .citem .rm{border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:12px; text-decoration:underline}
  .cfoot{border-top:1px solid var(--line); background:var(--card); padding:16px 18px}
  .cfoot .tot{display:flex; justify-content:space-between; font-size:16px; margin-bottom:12px}
  .cfoot .tot b{font-family:"Playfair Display",serif; color:var(--accent); font-size:22px}
  .cfoot .fin{width:100%; border:0; background:var(--accent); color:#fff; border-radius:12px; padding:15px; font-size:16px; font-weight:600; cursor:pointer}
  .cvazio{text-align:center; color:var(--muted); padding:50px 16px}
  footer{text-align:center; color:var(--muted); font-size:12px; padding:30px 16px 50px; border-top:1px solid var(--line)}
  footer .nm{font-family:"Playfair Display",serif; font-size:16px; color:var(--ink)}
  footer .obs{font-size:11px; margin-top:8px; opacity:.85}
</style>
</head>
<body>
<header class="hero">
  <div class="brand">BIG TRICOT<small>HOME DECOR</small></div>
  <div class="tagline">Catálogo de atacado</div>
</header>

<div class="barra">
  <label class="busca">🔎<input id="q" placeholder="Buscar produto…" autocomplete="off"></label>
  <div class="regiao" id="regiao">
    <button data-r="sul" class="on">Sul</button>
    <button data-r="norte">Norte</button>
  </div>
  <button class="btn-cart" id="abrirCart">🛒 Carrinho <span class="n" id="cartN">0</span></button>
</div>
<nav class="abas" id="abas"></nav>

<main id="app"><div class="vazio">Carregando catálogo…</div></main>

<footer>
  <div class="nm">Big Tricot</div>
  Monte Sião · MG<br>
  <span id="rodape"></span>
  <div class="obs">Preços e estoque do Syntech. Fotos e descrições do catálogo Big Tricot.</div>
</footer>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="cart" id="cart"><div class="pane" id="cartPane"></div></div>

<script>
(function(){
  "use strict";
  var D = (window.__DADOS__ && typeof window.__DADOS__==="object") ? window.__DADOS__ : {produtos:[],banco_cores:[],banco_tamanhos:[],estoque:{itens:{}}};
  var PRODUTOS = Array.isArray(D.produtos)?D.produtos:[];
  var CORES = {}; (D.banco_cores||[]).forEach(function(c){CORES[c.id]=c;});
  var TAM = {}; (D.banco_tamanhos||[]).forEach(function(t){TAM[t.id]=t;});
  var EST = (D.estoque&&D.estoque.itens)?D.estoque.itens:{};
  var regiao = "sul";
  var filtroTxt = "";
  var sel = { prod:null, corId:null, qtd:{} }; // qtd["corId|cod|idtam"] = n
  var CART = carregarCart();

  var SECOES = [
    {key:"pe",     titulo:"Pronta Entrega", sub:"Disponível para envio imediato", test:function(p){return p.pronta_entrega===true;}},
    {key:"polisoft",titulo:"Linha Polisoft", sub:"", test:function(p){return !p.pronta_entrega&&!p._edicao_limitada&&p.linha==="polisoft";}},
    {key:"soft",   titulo:"Linha Soft",     sub:"", test:function(p){return !p.pronta_entrega&&!p._edicao_limitada&&p.linha==="soft";}},
    {key:"natal",  titulo:"Natal",          sub:"Coleção de Natal", test:function(p){return !p.pronta_entrega&&!p._edicao_limitada&&p.linha==="natal";}},
    {key:"el",     titulo:"Edição Limitada",sub:"Peças exclusivas, em quantidade reduzida", promo:true, test:function(p){return p._edicao_limitada===true;}},
    {key:"outros", titulo:"Outros",         sub:"", test:function(p){return !p.pronta_entrega&&!p._edicao_limitada&&["polisoft","soft","natal"].indexOf(p.linha)<0;}}
  ];

  function brl(v){ v=Number(v)||0; return "R$ "+v.toFixed(2).replace(".",","); }
  function precoLinha(l){ return Number(regiao==="norte"? l.norte : l.sul)||0; }
  function menorPreco(p){ var m=Infinity; (p.grupos||[]).forEach(function(g){(g.linhas||[]).forEach(function(l){var v=precoLinha(l); if(v>0&&v<m)m=v;});}); return m===Infinity?0:m; }
  function estoqueProduto(p){ var tot=Number(p.estoque_geral)||0; return tot; }
  function inicial(nome){ return (String(nome||"?").trim()[0]||"?").toUpperCase(); }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function findProd(id){ return PRODUTOS.filter(function(x){return String(x.id)===String(id);})[0]; }
  function medidaDe(idt){ var t=TAM[idt]; return (t&&(t.medida||t.nome))||idt||"-"; }

  // ---------- GRID ----------
  function badgeHTML(p){ var est=estoqueProduto(p); return est>0?'<span class="badge"><span class="dot"></span>Em estoque</span>':'<span class="badge off"><span class="dot"></span>Sob encomenda</span>'; }
  function cardProd(p){
    var mp=menorPreco(p);
    return '<article class="prod" data-id="'+esc(p.id)+'">'+
      '<div class="foto">'+ (p.foto? '<div class="ph">'+inicial(p.nome)+'</div><img loading="lazy" src="'+esc(p.foto)+'" onload="this.style.opacity=1" onerror="this.remove()" style="opacity:0;transition:opacity .3s">' : '<div class="ph">'+inicial(p.nome)+'</div>') +
        badgeHTML(p) +
      '</div><div class="info"><div class="nome">'+esc(p.nome)+'</div>'+
      (mp? '<div class="preco">a partir de <b>'+brl(mp)+'</b></div>' : '<div class="preco">—</div>')+
      '</div></article>';
  }
  function render(){
    var app=document.getElementById("app"), abas=document.getElementById("abas");
    var q=filtroTxt.toLowerCase();
    var lista=PRODUTOS.filter(function(p){ return !q || String(p.nome||"").toLowerCase().indexOf(q)>=0; });
    var html="", tabs="";
    SECOES.forEach(function(s){
      var ps=lista.filter(s.test); if(!ps.length) return;
      tabs+='<a data-sec="sec-'+s.key+'"'+(s.promo?' class="promo"':'')+'>'+esc(s.titulo)+'</a>';
      html+='<section class="sec" id="sec-'+s.key+'"><h2 class="serif">'+esc(s.titulo)+'</h2>'+(s.sub?'<div class="sub">'+esc(s.sub)+'</div>':'')+'<div class="grade">'+ps.map(cardProd).join("")+'</div></section>';
    });
    abas.innerHTML=tabs; app.innerHTML=html||'<div class="vazio">Nenhum produto encontrado.</div>';
  }

  // ---------- MODAL PRODUTO ----------
  function corAtual(p){ if(sel.corId){ var c=(p.cores||[]).filter(function(x){return x.id_cor===sel.corId;})[0]; if(c) return c; } return (p.cores||[]).filter(function(x){return !x.oculta;})[0] || (p.cores||[])[0] || null; }
  function qKey(cod,idt){ return sel.corId+"|"+cod+"|"+idt; }

  function abrir(id){
    var p=findProd(id); if(!p) return;
    sel.prod=p; sel.qtd={};
    var c0=(p.cores||[]).filter(function(x){return !x.oculta;})[0] || (p.cores||[])[0];
    sel.corId=c0?c0.id_cor:null;
    renderDetalhe();
    document.getElementById("modal").classList.add("show");
    document.body.style.overflow="hidden";
  }
  window.__fechar=function(){ document.getElementById("modal").classList.remove("show"); document.body.style.overflow=""; };

  function blocosHTML(p){
    var b=p.blocos; if(!b||typeof b!=="object") return "";
    return Object.keys(b).map(function(k){
      var v=String(b[k]==null?"":b[k]).trim(); if(!v) return "";
      var itens=v.split("\n").map(function(x){return x.trim();}).filter(Boolean).map(function(x){return "<li>"+esc(x)+"</li>";}).join("");
      return '<div class="bloco"><h5>'+esc(k)+'</h5><ul>'+itens+'</ul></div>';
    }).join("");
  }
  function coresHTML(p){
    return (p.cores||[]).filter(function(c){return !c.oculta;}).map(function(c){
      var cc=CORES[c.id_cor]||{}; var on=c.id_cor===sel.corId?" on":"";
      return '<div class="corchip'+on+'" data-cor="'+esc(c.id_cor)+'"><span class="sw" style="background:'+esc(cc.hex||"#ddd")+'"></span>'+esc(cc.nome||"")+'</div>';
    }).join("");
  }
  function corFotoHTML(p){
    var cc=CORES[sel.corId]||{}; if(!cc.nome) return "";
    var img=cc.foto? '<img class="img" src="'+esc(cc.foto)+'" onerror="this.style.display=\'none\'">' : '<div class="img"></div>';
    return '<div class="lbl">Foto da cor selecionada</div><div class="corfoto">'+img+'<div class="cap">'+esc(cc.nome)+'</div></div>';
  }
  function tamanhosHTML(p){
    var cc=CORES[sel.corId]||{};
    var grupos=(p.grupos||[]).map(function(g){
      var rows=(g.linhas||[]).map(function(l){
        var k=qKey(l.cod,l.id_tamanho); var q=sel.qtd[k]||0;
        return '<div class="tamrow"><div class="med">'+esc(medidaDe(l.id_tamanho).split("×").join(" × "))+'</div>'+
          '<div class="pr">'+brl(precoLinha(l))+'</div>'+
          '<div class="stepper" data-k="'+esc(k)+'"><button data-d="-1">−</button><input type="number" min="0" value="'+q+'"><button data-d="1">+</button></div></div>';
      }).join("");
      return '<div class="grp"><div class="t">'+esc(g.titulo||"Itens")+'</div>'+rows+'</div>';
    }).join("");
    return '<div class="lbl">Escolha os tamanhos — '+esc(cc.nome||"")+'</div>'+grupos;
  }
  function prazoHTML(p){
    var est=estoqueProduto(p);
    return '<div class="prazo">'+(est>0? '📦 Em estoque — envio rápido.' : '🧶 Produção sob encomenda.')+'</div>';
  }
  function renderDetalhe(){
    var p=sel.prod;
    var foto = p.foto? '<div class="ph">'+inicial(p.nome)+'</div><img src="'+esc(p.foto)+'" onerror="this.remove()">' : '<div class="ph">'+inicial(p.nome)+'</div>';
    var video = p.video? '<video class="vid" controls preload="metadata" src="'+esc(p.video)+'"></video>' : '';
    var linhaLb = p.pronta_entrega?"Pronta Entrega":(p._edicao_limitada?"Edição Limitada":("Linha "+(p.linha||"").replace(/^\w/,function(c){return c.toUpperCase();})));
    document.getElementById("sheet").innerHTML =
      '<div class="topo"><span class="lb">'+esc(linhaLb)+'</span><button class="fechar" onclick="__fechar()">✕</button></div>'+
      '<div class="det">'+
        '<div class="lado-foto">'+foto+'</div>'+
        '<div class="lado-info">'+
          '<div class="linhalb">'+esc(linhaLb)+'</div>'+
          '<h3 class="nome serif">'+esc(p.nome)+'</h3>'+
          video+
          (p.composicao?'<div class="comp">'+esc(p.composicao)+'</div>':'')+
          prazoHTML(p)+
          blocosHTML(p)+
          '<div class="montar"><h4>🛒 Montar pedido</h4>'+
            '<div class="lbl">Escolha a cor</div><div class="cores" id="cores">'+coresHTML(p)+'</div>'+
            '<div id="corfoto">'+corFotoHTML(p)+'</div>'+
            '<div id="tamanhos">'+tamanhosHTML(p)+'</div>'+
            '<button class="addcart" id="addcart">🛒 Adicionar ao carrinho</button>'+
          '</div>'+
        '</div>'+
      '</div>';
    ligarDetalhe();
  }
  function atualizarCorArea(){
    document.getElementById("cores").innerHTML=coresHTML(sel.prod);
    document.getElementById("corfoto").innerHTML=corFotoHTML(sel.prod);
    document.getElementById("tamanhos").innerHTML=tamanhosHTML(sel.prod);
    ligarTamanhos();
  }
  function ligarDetalhe(){
    document.getElementById("cores").onclick=function(e){ var c=e.target.closest(".corchip"); if(!c)return; sel.corId=c.getAttribute("data-cor"); atualizarCorArea(); };
    document.getElementById("addcart").onclick=adicionarAoCarrinho;
    ligarTamanhos();
  }
  function ligarTamanhos(){
    var box=document.getElementById("tamanhos");
    box.querySelectorAll(".stepper").forEach(function(st){
      var k=st.getAttribute("data-k"); var inp=st.querySelector("input");
      st.querySelectorAll("button").forEach(function(b){ b.onclick=function(){ var d=Number(b.getAttribute("data-d")); var v=Math.max(0,(Number(inp.value)||0)+d); inp.value=v; sel.qtd[k]=v; }; });
      inp.oninput=function(){ sel.qtd[k]=Math.max(0,Number(inp.value)||0); };
    });
  }
  function adicionarAoCarrinho(){
    var p=sel.prod, cc=CORES[sel.corId]||{}; var add=0;
    (p.grupos||[]).forEach(function(g){ (g.linhas||[]).forEach(function(l){
      var k=qKey(l.cod,l.id_tamanho); var q=Number(sel.qtd[k])||0; if(q<=0) return;
      var preco=precoLinha(l);
      var achou=CART.filter(function(it){return it.cod===l.cod&&it.id_tamanho===l.id_tamanho&&it.corId===sel.corId&&it.regiao===regiao;})[0];
      if(achou){ achou.qtd+=q; } else {
        CART.push({pid:p.id, nome:p.nome, grupo:g.titulo||"", cod:l.cod, id_tamanho:l.id_tamanho, medida:medidaDe(l.id_tamanho), corId:sel.corId, corNome:cc.nome||"", preco:preco, regiao:regiao, qtd:q});
      }
      add+=q; sel.qtd[k]=0;
    }); });
    if(!add){ alert("Escolha a quantidade de pelo menos um tamanho."); return; }
    salvarCart(); atualizarCartN();
    // feedback: zera os inputs e mostra o carrinho
    atualizarCorArea();
    abrirCarrinho();
  }

  // ---------- CARRINHO ----------
  function cnpjSalvo(){ try{ return localStorage.getItem("bt_cnpj")||""; }catch(e){ return ""; } }
  function hashStr(s){ var h=5381,i=s.length; while(i){ h=(h*33)^s.charCodeAt(--i); } return (h>>>0).toString(36); }
  function carregarCart(){ try{ return JSON.parse(localStorage.getItem("bt_carrinho")||"[]")||[]; }catch(e){ return []; } }
  function salvarCart(){ try{ localStorage.setItem("bt_carrinho", JSON.stringify(CART)); }catch(e){} }
  function cartQtd(){ return CART.reduce(function(s,i){return s+(Number(i.qtd)||0);},0); }
  function cartTotal(){ return CART.reduce(function(s,i){return s+(Number(i.qtd)||0)*(Number(i.preco)||0);},0); }
  function atualizarCartN(){ document.getElementById("cartN").textContent=cartQtd(); }
  function abrirCarrinho(){ renderCarrinho(); document.getElementById("cart").classList.add("show"); document.body.style.overflow="hidden"; }
  window.__fecharCart=function(){ document.getElementById("cart").classList.remove("show"); if(!document.getElementById("modal").classList.contains("show")) document.body.style.overflow=""; };
  function renderCarrinho(){
    var itens = CART.length? CART.map(function(it,ix){
      return '<div class="citem"><div class="d"><div class="nm">'+esc(it.nome)+'</div>'+
        '<div class="meta">'+esc(it.grupo?it.grupo+" · ":"")+esc(it.medida)+' · '+esc(it.corNome)+' · '+esc(it.regiao==="norte"?"Norte":"Sul")+'</div>'+
        '<div class="l2"><div class="stepper" data-ix="'+ix+'"><button data-d="-1">−</button><input type="number" min="1" value="'+(Number(it.qtd)||0)+'"><button data-d="1">+</button></div>'+
        '<span class="sub">'+brl((Number(it.qtd)||0)*(Number(it.preco)||0))+'</span></div>'+
        '<button class="rm" data-rm="'+ix+'">remover</button></div></div>';
    }).join("") : '<div class="cvazio">Seu carrinho está vazio.<br>Escolha um produto e monte seu pedido.</div>';
    document.getElementById("cartPane").innerHTML=
      '<div class="ctopo"><h3 class="serif">🛒 Meu pedido</h3><button class="fechar" onclick="__fecharCart()">✕</button></div>'+
      '<div class="itens">'+itens+'</div>'+
      '<div class="cfoot"><div class="tot"><span>Total</span><b>'+brl(cartTotal())+'</b></div>'+
      (CART.length?('<label style="display:block;font-size:13px;color:#555;margin:2px 0 8px">CNPJ da sua loja'+
        '<input id="cnpjInp" type="text" inputmode="numeric" autocomplete="off" placeholder="00.000.000/0000-00" value="'+esc(cnpjSalvo())+'" style="display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:10px;border:1px solid #d6d0c4;border-radius:10px;font-size:15px"></label>'+
        '<div id="cmsg" style="font-size:13px;margin:0 0 8px;min-height:1px;line-height:1.35"></div>'):'')+
      '<button class="fin" id="finalizar"'+(CART.length?"":" disabled")+'>'+(CART.length?"Enviar pedido":"Finalizar pedido")+'</button></div>';
    var box=document.getElementById("cartPane");
    box.querySelectorAll(".citem .stepper").forEach(function(st){
      var ix=Number(st.getAttribute("data-ix")); var inp=st.querySelector("input");
      st.querySelectorAll("button").forEach(function(b){ b.onclick=function(){ var d=Number(b.getAttribute("data-d")); CART[ix].qtd=Math.max(1,(Number(CART[ix].qtd)||1)+d); salvarCart(); atualizarCartN(); renderCarrinho(); }; });
      inp.onchange=function(){ CART[ix].qtd=Math.max(1,Number(inp.value)||1); salvarCart(); atualizarCartN(); renderCarrinho(); };
    });
    box.querySelectorAll("[data-rm]").forEach(function(b){ b.onclick=function(){ CART.splice(Number(b.getAttribute("data-rm")),1); salvarCart(); atualizarCartN(); renderCarrinho(); }; });
    var fin=document.getElementById("finalizar"); if(fin) fin.onclick=finalizarPedido;
  }
  function finalizarPedido(){
    if(!CART.length) return;
    var btn=document.getElementById("finalizar"); var msg=document.getElementById("cmsg");
    var cnpjEl=document.getElementById("cnpjInp"); var cnpj=(cnpjEl&&cnpjEl.value||"").trim();
    var dig=cnpj.replace(/\D+/g,"");
    function erro(m){ if(msg){ msg.textContent=m; msg.style.color="#b91c1c"; } }
    if(dig.length<11){ erro("Digite o CNPJ (ou CPF) da sua loja para enviar o pedido."); if(cnpjEl) cnpjEl.focus(); return; }
    try{ localStorage.setItem("bt_cnpj", cnpj); }catch(e){}
    var itens=CART.map(function(it){ return {cod:it.cod, medida:it.medida, corNome:it.corNome, corId:it.corId, qtd:it.qtd, preco:it.preco, regiao:it.regiao, nome:it.nome, grupo:it.grupo}; });
    var idem=hashStr(dig+"|"+JSON.stringify(itens));
    if(msg){ msg.textContent=""; }
    btn.disabled=true; btn.textContent="Enviando…";
    fetch("/api/loja/pedido",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({cnpj:cnpj, itens:itens, idem:idem})})
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j||{}}; }); })
      .then(function(res){
        if(res.ok && res.j.ok){
          CART=[]; salvarCart(); atualizarCartN();
          var nome=res.j.cliente?(", "+esc(res.j.cliente)):"";
          document.getElementById("cartPane").innerHTML=
            '<div class="ctopo"><h3 class="serif">🛒 Meu pedido</h3><button class="fechar" onclick="__fecharCart()">✕</button></div>'+
            '<div class="itens"><div class="cvazio" style="color:#166534;font-weight:600">✓ '+esc(res.j.msg||"Pedido enviado!")+'</div>'+
            '<div class="cvazio" style="font-weight:400">Obrigado'+nome+'! Qualquer dúvida, fale com a Big Tricot.</div></div>';
        } else {
          var m=res.j.msg||"Não consegui enviar o pedido agora. Tente novamente.";
          if(res.j.detalhe&&res.j.detalhe.length){ m+=" ("+res.j.detalhe.join("; ")+")"; }
          erro(m); btn.disabled=false; btn.textContent="Enviar pedido";
        }
      })
      .catch(function(){ erro("Sem conexão no momento. Tente novamente."); btn.disabled=false; btn.textContent="Enviar pedido"; });
  }

  // ---------- eventos globais ----------
  document.getElementById("app").addEventListener("click",function(e){ var el=e.target.closest(".prod"); if(el) abrir(el.getAttribute("data-id")); });
  document.getElementById("modal").addEventListener("click",function(e){ if(e.target.id==="modal") window.__fechar(); });
  document.getElementById("cart").addEventListener("click",function(e){ if(e.target.id==="cart") window.__fecharCart(); });
  document.getElementById("abrirCart").addEventListener("click",abrirCarrinho);
  document.getElementById("regiao").addEventListener("click",function(e){ var b=e.target.closest("button"); if(!b)return; regiao=b.getAttribute("data-r"); Array.prototype.forEach.call(this.querySelectorAll("button"),function(x){x.classList.toggle("on",x===b);}); render(); if(document.getElementById("modal").classList.contains("show")) renderDetalhe(); });
  document.getElementById("q").addEventListener("input",function(){ filtroTxt=this.value; render(); });
  document.getElementById("abas").addEventListener("click",function(e){ var a=e.target.closest("a"); if(!a)return; var t=document.getElementById(a.getAttribute("data-sec")); if(t)t.scrollIntoView({behavior:"smooth"}); });

  try{ var r=document.getElementById("rodape"); var n=PRODUTOS.length; var d=D.estoque&&D.estoque.atualizadoMs? new Date(D.estoque.atualizadoMs):new Date(); r.textContent=n+" produtos · atualizado em "+d.toLocaleDateString("pt-BR"); }catch(e){}

  atualizarCartN();
  render();
})();
</script>
</body>
</html>
