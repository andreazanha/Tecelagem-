<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Big Tricot · Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f4ee; --card:#ffffff; --ink:#24201d; --muted:#8a8073; --line:#e8e2d7;
    --accent:#ad5033; --accent-soft:#bd6245; --ok:#5d7a4a; --chip:#efe7d8;
    --shadow:0 1px 2px rgba(60,48,32,.05),0 10px 26px rgba(60,48,32,.06);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg); color:var(--ink); font-family:'Montserrat',system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased; line-height:1.45}
  .serif{font-family:"Cormorant Garamond",Georgia,serif}
  /* banner full-width, começa no TOPO da página (sem faixa preta em cima) */
  .banner{position:relative; width:100%; min-height:300px; overflow:hidden; background:#181615; display:flex; align-items:center}
  .banner .b-bg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0}
  .banner .b-shade{position:absolute; inset:0; z-index:1; background:linear-gradient(90deg,rgba(24,22,21,.80) 0%,rgba(24,22,21,.38) 46%,rgba(24,22,21,.08) 100%)}
  .banner .b-in{position:relative; z-index:2; max-width:1760px; margin:0 auto; width:100%; padding:0 40px; color:#fff}
  .banner .b-kick{font-size:12px; letter-spacing:.3em; text-transform:uppercase; color:#e7decf; font-weight:500}
  .banner .b-tit{font-size:48px; font-weight:600; line-height:1.04; letter-spacing:.015em; margin:12px 0 0; max-width:640px}
  .banner .b-sub{font-size:12px; letter-spacing:.24em; text-transform:uppercase; color:#d8cfc0; margin-top:14px}
  .banner .b-btn{display:inline-flex; align-items:center; gap:8px; margin-top:22px; background:var(--accent); color:#fff; border:0; border-radius:4px; padding:13px 26px; font-size:12px; letter-spacing:.16em; text-transform:uppercase; font-weight:600; cursor:pointer; text-decoration:none}
  /* FAIXA PRETA GRAFITE abaixo do banner: busca centralizada + cliente/carrinho à direita */
  .buscafaixa{background:#181615; padding:16px 24px; position:sticky; top:0; z-index:40}
  .bf-in{position:relative; max-width:1760px; margin:0 auto; display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; min-height:46px}
  .busca{width:100%; max-width:500px; display:flex; align-items:center; gap:10px; background:#fff; border:1px solid #e8e2d7; border-radius:999px; padding:11px 20px; box-shadow:0 1px 2px rgba(0,0,0,.14)}
  .busca input{border:0; outline:0; background:transparent; width:100%; font-size:14.5px; color:var(--ink)}
  .bf-right{position:absolute; right:0; top:50%; transform:translateY(-50%); display:flex; align-items:center; gap:14px}
  .saud{display:flex; align-items:center; gap:8px; font-size:14px; color:#e9e2d6; white-space:nowrap}
  .btn-cart{display:flex; align-items:center; gap:7px; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:999px; padding:9px 17px; font-weight:600; font-size:13px; cursor:pointer; white-space:nowrap}
  .btn-cart .n{background:#fff; color:var(--accent); border-radius:999px; min-width:20px; height:20px; display:inline-flex; align-items:center; justify-content:center; font-size:12px; padding:0 5px}
  .abas{display:none}
  main{max-width:1760px; margin:0 auto; padding:18px 24px 70px}
  .sec{margin-top:30px; scroll-margin-top:96px}
  .sec h2{font-size:30px; margin:0; text-align:center; font-weight:600; color:var(--ink); display:flex; align-items:center; justify-content:center; gap:20px}
  .sec h2::before,.sec h2::after{content:""; height:1px; width:60px; background:var(--line)}
  .sec .sub{text-align:center; color:var(--muted); font-size:12px; letter-spacing:.18em; text-transform:uppercase; margin-top:6px}
  .grade{display:grid; grid-template-columns:repeat(2,1fr); gap:22px; margin-top:24px}
  @media(min-width:700px){ .grade{grid-template-columns:repeat(3,1fr)} }
  @media(min-width:1040px){ .grade{grid-template-columns:repeat(4,1fr)} }
  @media(max-width:430px){ .grade{grid-template-columns:1fr} }
  .prod{background:#fff; border:0; border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); cursor:pointer; transition:transform .14s ease, box-shadow .14s ease}
  .prod:hover{transform:translateY(-3px); box-shadow:0 2px 6px rgba(60,48,32,.08),0 18px 40px rgba(60,48,32,.12)}
  .foto{position:relative; aspect-ratio:1/1; background:#efe7d8; overflow:hidden}
  .foto img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; z-index:1}
  .foto .ph{position:absolute; inset:0; z-index:0; display:flex; align-items:center; justify-content:center; font-family:"Cormorant Garamond",serif; font-size:34px; color:#c3b49a; letter-spacing:.06em}
  .badge{position:absolute; left:12px; top:12px; font-size:11px; font-weight:600; padding:5px 11px; border-radius:999px; background:rgba(255,255,255,.95); color:#4f7a44; display:flex; align-items:center; gap:6px; z-index:2; box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .badge.off{color:#9c7b4a}
  .badge .dot{width:7px; height:7px; border-radius:50%; background:currentColor}
  .prod .info{padding:14px 16px 16px}
  .prod .nome{font-weight:600; font-size:14px; color:var(--ink); line-height:1.3}
  .preco{margin-top:7px; font-size:11.5px; color:var(--muted)}
  .preco b{color:var(--accent); font-size:15px; font-weight:700; margin-left:2px}
  .vazio{text-align:center; color:var(--muted); padding:60px 16px}
  @media(max-width:900px){ .bf-right{position:static; transform:none; width:100%; justify-content:center; order:2} .busca{order:1; max-width:none} }
  @media(max-width:640px){ .buscafaixa{padding:12px 16px} .banner{min-height:340px} .banner .b-in{padding:0 20px} .banner .b-tit{font-size:30px} main{padding:14px 16px 60px} .sec{margin-top:24px} .sec h2{font-size:24px; gap:12px} .sec h2::before,.sec h2::after{width:34px} }
  /* ---- popup "continuar / escolher outro" ao adicionar no carrinho ---- */
  .popconf{position:fixed; inset:0; z-index:80; background:rgba(44,39,33,.55); display:flex; align-items:center; justify-content:center; padding:20px}
  .popconf-box{background:var(--card); border-radius:16px; max-width:360px; width:100%; padding:24px 22px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .popconf-ic{font-size:34px}
  .popconf-tit{font-weight:700; font-size:17px; margin-top:6px; color:var(--ink)}
  .popconf-sub{color:var(--muted); font-size:13px; margin-top:4px}
  .popconf-acts{display:flex; flex-direction:column; gap:9px; margin-top:16px}
  .popconf-acts button{border-radius:10px; padding:12px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit}
  .popconf-b1{background:var(--accent); color:#fff; border:0}
  .popconf-b2{background:var(--card); color:var(--ink); border:1px solid var(--line)}
  .popconf-cart{margin-top:12px; background:none; border:0; color:var(--muted); font-size:12.5px; cursor:pointer; text-decoration:underline; font-family:inherit}
  /* ---- modal produto (largo, 2 colunas) ---- */
  .modal{position:fixed; inset:0; z-index:60; background:rgba(44,39,33,.55); display:none}
  .modal.show{display:block}
  .sheet{position:absolute; inset:3% 2%; max-width:1500px; margin:0 auto; background:var(--card); border-radius:16px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 24px 70px rgba(0,0,0,.34)}
  .sheet .topo{display:flex; justify-content:space-between; align-items:center; padding:12px 18px; border-bottom:1px solid var(--line); flex:0 0 auto}
  .sheet .topo .lb{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:600}
  .sheet .fechar{border:0; background:var(--chip); width:34px; height:34px; border-radius:50%; font-size:16px; cursor:pointer; color:var(--ink)}
  .det{flex:1 1 auto; display:flex; min-height:0}
  .det .lado-foto{flex:1 1 53%; background:#efe7d8; position:relative; overflow:hidden}
  .det .lado-foto img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; z-index:1}
  .det .lado-foto .ph{position:absolute; inset:0; z-index:0; display:flex; align-items:center; justify-content:center; font-family:"Cormorant Garamond",serif; font-size:64px; color:#c3b49a}
  .det .lado-info{flex:1 1 47%; overflow:auto; padding:24px 28px 26px}
  .det .linhalb{text-align:center; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:600; margin-bottom:3px}
  .det .nome{font-size:28px; margin:0 0 14px; font-weight:600; text-align:center; letter-spacing:.01em; line-height:1.1}
  .vid{width:100%; border-radius:12px; background:#000; margin-bottom:12px; max-height:300px}
  .comp{text-align:center; color:var(--muted); font-size:13px; letter-spacing:.04em}
  .prazo{display:flex; gap:8px; align-items:center; background:#f6efe3; border:1px solid var(--line); border-radius:12px; padding:10px 14px; font-size:13px; color:var(--ink); margin:14px 0}
  .bloco{margin-top:14px}
  .bloco h5{margin:0 0 5px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
  .bloco ul{margin:0; padding-left:18px; font-size:14px}
  .bloco li{margin:2px 0}
  .montar{margin-top:22px; border-top:1px solid var(--line); padding-top:18px}
  .montar h4{display:flex; align-items:center; gap:8px; font-size:17px; margin:0 0 14px}
  .lbl{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:16px 0 8px}
  .lbl b{color:var(--ink); text-transform:none; letter-spacing:0; font-weight:600}
  .lbl .cnt{color:#7a7068; font-weight:400; text-transform:none; letter-spacing:0; font-size:12px}
  .cores{display:flex; flex-wrap:wrap; gap:11px; align-items:center}
  .sw-dot{width:36px; height:36px; border-radius:50%; padding:0; outline:0; cursor:pointer; background:#efe7d8 center/cover no-repeat; border:2px solid #fff; box-shadow:0 0 0 1px var(--line); transition:transform .1s ease, box-shadow .1s ease}
  .sw-dot:hover{transform:scale(1.09); box-shadow:0 0 0 1px #cabfa9}
  .sw-dot.on{border-color:#fff; box-shadow:0 0 0 2px #ae5033}
  .corfoto{margin-top:10px; display:flex; flex-direction:row; align-items:center; gap:12px}
  .corfoto .cf-img{width:75px; height:75px; border-radius:10px; background:#efe7d8; object-fit:cover; border:1px solid var(--line); flex:0 0 auto}
  .corfoto img.cf-img{cursor:zoom-in}
  .corfoto .cf-nm{font-weight:600; font-size:14px; color:var(--ink)}
  .corfoto .cf-amp{font-size:11.5px; color:var(--muted); margin-top:2px}
  /* ---- lightbox: foto da cor ampliada ---- */
  .lightbox{position:fixed; inset:0; z-index:90; background:rgba(20,16,12,.9); display:flex; align-items:center; justify-content:center; padding:24px; cursor:zoom-out}
  .lightbox img{max-width:min(94vw,1100px); max-height:92vh; border-radius:12px; box-shadow:0 20px 70px rgba(0,0,0,.5)}
  .lightbox .cap{position:fixed; left:0; right:0; bottom:20px; text-align:center; color:#fff; font-size:15px; font-weight:600; text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .lb-x{position:fixed; top:16px; right:20px; background:rgba(255,255,255,.16); color:#fff; border:0; border-radius:50%; width:42px; height:42px; font-size:18px; cursor:pointer}
  .grp{margin-top:16px}
  .grp{margin-bottom:4px}
  .grp .t{color:var(--accent); font-weight:600; font-size:15px; margin:14px 0 2px; letter-spacing:.01em}
  .grp:first-child .t{margin-top:4px}
  .tamrow{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid var(--line)}
  .tamrow .medbox{min-width:0}
  .tamrow .med{font-size:15px; color:var(--ink); font-weight:500; line-height:1.3}
  .tamrow .med small{color:var(--muted); margin-left:6px}
  .tamrow .estx{font-size:12.5px; color:#6f685e; margin-top:3px}
  .tamrow .estx.low{color:var(--accent); font-weight:600}
  .tamrow .estx.off{color:#9aa0ab}
  .tamrow .pr{color:var(--ink); font-weight:600; font-size:14px; font-family:'Montserrat',sans-serif; margin-left:auto; margin-right:10px; white-space:nowrap; line-height:1.3}
  .stepper{display:flex; align-items:center; gap:0; border:1px solid var(--line); border-radius:999px; overflow:hidden}
  .stepper button{border:0; background:var(--chip); width:30px; height:30px; font-size:17px; cursor:pointer; color:var(--ink)}
  .stepper input{width:40px; border:0; text-align:center; font-size:14px; background:transparent; outline:0; -moz-appearance:textfield}
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
  .resumo{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:16px; padding:12px 16px; background:#faf6ef; border:1px solid var(--line); border-radius:10px}
  .resumo .rz-q{font-size:13.5px; color:var(--muted)}
  .resumo .rz-v{font-size:19px; font-weight:700; color:var(--ink); font-family:'Montserrat',sans-serif}
  .addcart{position:sticky; bottom:0; margin-top:10px; width:100%; min-height:46px; border:0; background:#ae5033; color:#fff; border-radius:10px; padding:12px 15px; font-size:15px; font-weight:600; letter-spacing:.01em; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px}
  .addcart:disabled{background:#cdbfa8; cursor:default}
  @media(max-width:860px){ .det{flex-direction:column; overflow:auto} .det .lado-foto{flex:0 0 auto; aspect-ratio:4/3} .det .lado-info{overflow:visible} .sheet{inset:0; border-radius:0; max-width:none} }
  /* ---- carrinho (gaveta) ---- */
  .cart{position:fixed; inset:0; z-index:70; background:rgba(44,39,33,.5); display:none}
  .cart.show{display:block}
  .cart .pane{position:absolute; top:0; right:0; bottom:0; width:100%; max-width:680px; background:var(--bg); display:flex; flex-direction:column; box-shadow:-10px 0 40px rgba(0,0,0,.2)}
  .cart .ctopo{display:flex; justify-content:space-between; align-items:center; padding:18px 22px; border-bottom:1px solid var(--line); background:var(--card)}
  .cart .ctopo h3{margin:0; font-size:22px}
  .cart .itens{flex:1 1 auto; overflow:auto; padding:12px 20px}
  .citem{display:flex; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:13px 15px; margin-bottom:11px}
  .citem .d{flex:1}
  .citem .nm{font-weight:600; font-size:16px}
  .citem .meta{color:var(--muted); font-size:13.5px; margin-top:2px}
  .citem .l2{display:flex; align-items:center; justify-content:space-between; margin-top:9px}
  .citem .sub{color:var(--ink); font-weight:600; font-family:'Montserrat',sans-serif; font-size:15px}
  .citem .rm{border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:13px; text-decoration:underline}
  .cfoot{border-top:1px solid var(--line); background:var(--card); padding:18px 22px}
  .cfoot .tot{display:flex; justify-content:space-between; font-size:18px; margin-bottom:12px}
  .cfoot .tot b{font-family:'Montserrat',sans-serif; color:var(--ink); font-size:22px; font-weight:700}
  .cfoot .fin{width:100%; border:0; background:var(--accent); color:#fff; border-radius:12px; padding:17px; font-size:18px; font-weight:600; cursor:pointer}
  .cvazio{text-align:center; color:var(--muted); padding:50px 16px}
  footer{text-align:center; color:var(--muted); font-size:12px; padding:30px 16px 50px; border-top:1px solid var(--line)}
  footer .nm{font-family:"Cormorant Garamond",serif; font-size:16px; color:var(--ink)}
  footer .obs{font-size:11px; margin-top:8px; opacity:.85}
</style>
</head>
<body>
<section class="banner" id="banner"></section>

<div class="buscafaixa">
  <div class="bf-in">
    <label class="busca">🔎<input id="q" placeholder="Buscar produto, cor ou referência…" autocomplete="off"></label>
    <div class="bf-right">
      <span id="saudacao" class="saud" style="display:none"></span>
      <button class="btn-cart" id="abrirCart">🛒 Carrinho <span class="n" id="cartN">0</span></button>
    </div>
  </div>
</div>
<nav class="abas" id="abas"></nav>

<main id="app"><div class="vazio">Carregando catálogo…</div></main>

<footer>
  <div class="nm">Big Tricot</div>
  Monte Sião · MG<br>
  <span id="rodape"></span>
  <div class="obs">Preços e estoque do Syntech. Fotos e descrições do catálogo Big Tricot.</div>
</footer>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="cart" id="cart"><div class="pane" id="cartPane"></div></div>

<div id="entrada" style="position:fixed;inset:0;z-index:999;background:rgba(44,39,33,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:18px">
  <div style="background:#fff;border-radius:18px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden">
    <div style="padding:26px 24px 8px;text-align:center">
      <div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;font-weight:700;letter-spacing:.02em;color:#2c2721">BIG TRICOT</div>
      <div style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#ad5033;margin-top:2px">Catálogo de atacado</div>
    </div>
    <div style="padding:14px 24px 24px">
      <label style="display:block;font-size:14px;color:#5f584e;margin-bottom:6px">Informe o CNPJ da sua loja para entrar</label>
      <input id="entCnpj" type="text" inputmode="numeric" autocomplete="off" placeholder="00.000.000/0000-00" style="display:block;width:100%;box-sizing:border-box;padding:13px;border:1px solid #d6d0c4;border-radius:12px;font-size:16px">
      <div id="entMsg" style="font-size:13px;min-height:1px;margin:8px 0;line-height:1.35"></div>
      <button id="entBtn" style="width:100%;padding:14px;border:0;border-radius:12px;background:#ad5033;color:#fff;font-size:16px;font-weight:600;cursor:pointer">Entrar</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var D = (window.__DADOS__ && typeof window.__DADOS__==="object") ? window.__DADOS__ : {produtos:[],banco_cores:[],banco_tamanhos:[],estoque:{itens:{}}};
  var PRODUTOS = Array.isArray(D.produtos)?D.produtos:[];
  var CORES = {}; (D.banco_cores||[]).forEach(function(c){CORES[c.id]=c;});
  var TAM = {}; (D.banco_tamanhos||[]).forEach(function(t){TAM[t.id]=t;});
  var EST = (D.estoque&&D.estoque.itens)?D.estoque.itens:{};
  var regiao = "sul";
  var filtroTxt = "";
  var sel = { prod:null, corId:null, qtd:{} }; // qtd["corId|cod|idtam"] = n
  var CART = carregarCart();

  var SECOES = [
    {key:"pe",     titulo:"Pronta Entrega", sub:"Disponível para envio imediato", test:function(p){return p.pronta_entrega===true;}},
    {key:"polisoft",titulo:"Linha Polisoft", sub:"", test:function(p){return !p.pronta_entrega&&!p._edicao_limitada&&p.linha==="polisoft";}},
    {key:"soft",   titulo:"Linha Soft",     sub:"", test:function(p){return !p.pronta_entrega&&!p._edicao_limitada&&p.linha==="soft";}},
    {key:"natal",  titulo:"Natal",          sub:"Coleção de Natal", test:function(p){return !p.pronta_entrega&&!p._edicao_limitada&&p.linha==="natal";}},
    {key:"el",     titulo:"Edição Limitada",sub:"Peças exclusivas, em quantidade reduzida", promo:true, test:function(p){return p._edicao_limitada===true;}},
    {key:"outros", titulo:"Outros",         sub:"", test:function(p){return !p.pronta_entrega&&!p._edicao_limitada&&["polisoft","soft","natal"].indexOf(p.linha)<0;}}
  ];

  function brl(v){ v=Number(v)||0; return "R$ "+v.toFixed(2).replace(".",","); }
  function precoLinha(l){ return Number(regiao==="norte"? l.norte : l.sul)||0; }
  function menorPreco(p){ var m=Infinity; (p.grupos||[]).forEach(function(g){(g.linhas||[]).forEach(function(l){var v=precoLinha(l); if(v>0&&v<m)m=v;});}); return m===Infinity?0:m; }
  function estoqueProduto(p){ var tot=Number(p.estoque_geral)||0; return tot; }
  function inicial(nome){ return (String(nome||"?").trim()[0]||"?").toUpperCase(); }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function findProd(id){ return PRODUTOS.filter(function(x){return String(x.id)===String(id);})[0]; }
  function medidaDe(idt){ var t=TAM[idt]; return (t&&(t.medida||t.nome))||idt||"-"; }

  // ---------- GRID ----------

  // ---------- MODAL PRODUTO ----------
  function corAtual(p){ if(sel.corId){ var c=(p.cores||[]).filter(function(x){return x.id_cor===sel.corId;})[0]; if(c) return c; } return (p.cores||[]).filter(function(x){return !x.oculta;})[0] || (p.cores||[])[0] || null; }
  function qKey(cod,idt){ return sel.corId+"|"+cod+"|"+idt; }

  function abrir(id){
    var p=findProd(id); if(!p) return;
    sel.prod=p; sel.qtd={};
    var c0=(p.cores||[]).filter(function(x){return !x.oculta;})[0] || (p.cores||[])[0];

  function blocosHTML(p){

    return Object.keys(b).map(function(k){
      var v=String(b[k]==null?"":b[k]).trim(); if(!v) return "";
      var itens=v.split("\n").map(function(x){return x.trim();}).filter(Boolean).map(function(x){return "<li>"+esc(x)+"</li>";}).join("");
      return '<div class="bloco"><h5>'+esc(k)+'</h5><ul>'+itens+'</ul></div>';
    }).join("");

  // Cores como BOLINHAS com a textura real (a mesma foto cc.foto que já existe).

  function coresHTML(p){

    var img=cc.foto? '<img class="cf-img" src="'+esc(cc.foto)+'" data-nome="'+esc(cc.nome||"")+'" onclick="__zoomCor(this.src,this.getAttribute(\'data-nome\'))" onerror="this.style.display=\'none\'">' : '<div class="cf-img ph"></div>';

  // Lightbox da foto do tecido da cor (abre a imagem grande pro cliente ver o detalhe).

  // saldo da variação (produto+tamanho+cor selecionada), se o estoque por variação existir.
  function estSaldo(cod,idt){
    var med=medidaDe(idt); var m=EST[cod]&&EST[cod][med]; if(!m) return null;
    var v=m[sel.corId]; return (v==null)?null:(Number(v)||0);
  }
  // texto de estoque por linha, no estilo do catálogo: "7 em estoque" / "últimas 2 unidades".
  function estTxtLinha(cod,idt){
    var s=estSaldo(cod,idt); if(s==null) return "";
    if(s<=0) return '<div class="estx off">sob encomenda</div>';
    if(s<=3) return '<div class="estx low">'+(s===1?'última unidade':'últimas '+s+' unidades')+'</div>';
    return '<div class="estx">'+s+' em estoque</div>';
  }
  function tamanhosHTML(p){
    var cc=CORES[sel.corId]||{};
    var grupos=(p.grupos||[]).map(function(g){
      var rows=(g.linhas||[]).map(function(l){
        var k=qKey(l.cod,l.id_tamanho); var q=sel.qtd[k]||0;
        return '<div class="tamrow"><div class="medbox"><div class="med">'+esc(medidaDe(l.id_tamanho).replace(/(\d)\s*[×xX]\s*(\d)/g,"$1 × $2"))+'</div>'+estTxtLinha(l.cod,l.id_tamanho)+'</div>'+
          '<div class="pr">'+brl(precoLinha(l))+'</div>'+
          '<div class="stepper" data-k="'+esc(k)+'"><button data-d="-1">−</button><input type="number" min="0" value="'+q+'"><button data-d="1">+</button></div></div>';
      }).join("");
      return '<div class="grp"><div class="t">'+esc(g.titulo||"Itens")+'</div>'+rows+'</div>';
    }).join("");
    return '<div class="lbl">Escolha os tamanhos — <b>'+esc(cc.nome||"")+'</b></div>'+grupos;
  }
  function prazoHTML(p){
    var est=estoqueProduto(p);
    return '<div class="prazo">'+(est>0? '📦 Em estoque — envio rápido.' : '🧶 Produção sob encomenda.')+'</div>';
  }
  // Resumo do pedido (peças + valor) — usa os MESMOS preços/regras já existentes.
  function resumoHTML(p){
    var pecas=0, total=0;
    (p.grupos||[]).forEach(function(g){ (g.linhas||[]).forEach(function(l){
      var q=Number(sel.qtd[qKey(l.cod,l.id_tamanho)])||0; if(q<=0) return;
      pecas+=q; total+=q*precoLinha(l);
    }); });
    return '<span class="rz-q">'+pecas+' '+(pecas===1?'peça selecionada':'peças selecionadas')+'</span><b class="rz-v">'+brl(total)+'</b>';

  function atualizarResumo(){ var el=document.getElementById("resumo"); if(el) el.innerHTML=resumoHTML(sel.prod); }
  function renderDetalhe(){
    var p=sel.prod;
    var foto = p.foto? '<div class="ph">'+inicial(p.nome)+'</div><img src="'+esc(p.foto)+'" onerror="this.remove()">' : '<div class="ph">'+inicial(p.nome)+'</div>';
    var video = p.video? '<video class="vid" controls preload="metadata" src="'+esc(p.video)+'"></video>' : '';
    var linhaLb = p.pronta_entrega?"Pronta Entrega":(p._edicao_limitada?"Edição Limitada":("Linha "+(p.linha||"").replace(/^\w/,function(c){return c.toUpperCase();})));
    var ncores=(p.cores||[]).filter(function(c){return !c.oculta;}).length;
    document.getElementById("sheet").innerHTML =
      '<div class="topo"><span class="lb">'+esc(linhaLb)+'</span><button class="fechar" onclick="__fechar()">✕</button></div>'+
      '<div class="det">'+
        '<div class="lado-foto">'+foto+'</div>'+
        '<div class="lado-info">'+
          '<div class="linhalb">'+esc(linhaLb)+'</div>'+
          '<h3 class="nome serif">'+esc(p.nome)+'</h3>'+

          (p.composicao?'<div class="comp">'+esc(p.composicao)+'</div>':'')+
          blocosHTML(p)+
          prazoHTML(p)+
          '<div class="montar"><h4>Montar pedido</h4>'+
            '<div class="lbl">Escolha a cor'+(ncores>1?' <span class="cnt">· '+ncores+' cores disponíveis</span>':'')+'</div><div class="cores" id="cores">'+coresHTML(p)+'</div>'+
            '<div id="corfoto">'+corFotoHTML(p)+'</div>'+
            '<div id="tamanhos">'+tamanhosHTML(p)+'</div>'+
            '<div class="resumo" id="resumo">'+resumoHTML(p)+'</div>'+
            '<button class="addcart" id="addcart">Adicionar ao carrinho</button>'+
          '</div>'+

  function atualizarCorArea(){
    document.getElementById("cores").innerHTML=coresHTML(sel.prod);
    document.getElementById("corfoto").innerHTML=corFotoHTML(sel.prod);
    document.getElementById("tamanhos").innerHTML=tamanhosHTML(sel.prod);
    ligarTamanhos();
    atualizarResumo();
  }
  function ligarDetalhe(){
    document.getElementById("cores").onclick=function(e){ var c=e.target.closest(".sw-dot"); if(!c)return; sel.corId=c.getAttribute("data-cor"); atualizarCorArea(); };
    document.getElementById("addcart").onclick=adicionarAoCarrinho;
    ligarTamanhos();
  }
  function ligarTamanhos(){
    var box=document.getElementById("tamanhos");
    box.querySelectorAll(".stepper").forEach(function(st){
      var k=st.getAttribute("data-k"); var inp=st.querySelector("input");
      st.querySelectorAll("button").forEach(function(b){ b.onclick=function(){ var d=Number(b.getAttribute("data-d")); var v=Math.max(0,(Number(inp.value)||0)+d); inp.value=v; sel.qtd[k]=v; atualizarResumo(); }; });
      inp.oninput=function(){ sel.qtd[k]=Math.max(0,Number(inp.value)||0); atualizarResumo(); };
    });
  }
  function adicionarAoCarrinho(){
    var p=sel.prod, cc=CORES[sel.corId]||{}; var add=0;
    (p.grupos||[]).forEach(function(g){ (g.linhas||[]).forEach(function(l){
      var k=qKey(l.cod,l.id_tamanho); var q=Number(sel.qtd[k])||0; if(q<=0) return;
      var preco=precoLinha(l);
      var achou=CART.filter(function(it){return it.cod===l.cod&&it.id_tamanho===l.id_tamanho&&it.corId===sel.corId&&it.regiao===regiao;})[0];
      if(achou){ achou.qtd+=q; } else {
        CART.push({pid:p.id, nome:p.nome, grupo:g.titulo||"", cod:l.cod, id_tamanho:l.id_tamanho, medida:medidaDe(l.id_tamanho), corId:sel.corId, corNome:cc.nome||"", preco:preco, regiao:regiao, qtd:q});
      }
      add+=q; sel.qtd[k]=0;
    }); });
    if(!add){ alert("Escolha a quantidade de pelo menos um tamanho."); return; }
    salvarCart(); atualizarCartN();
    // feedback: zera os inputs e pergunta se continua no mesmo modelo ou escolhe outro
    atualizarCorArea();
    perguntarContinuar(add);
  }
  // Popup após adicionar: continuar neste modelo (fica no produto) ou escolher outro (volta ao catálogo).
  function perguntarContinuar(add){
    var ov=document.createElement("div"); ov.className="popconf";
    ov.innerHTML=
      '<div class="popconf-box" role="dialog" aria-modal="true">'+
        '<div class="popconf-ic">🛒</div>'+
        '<div class="popconf-tit">'+add+' peça'+(add>1?'s':'')+' no carrinho!</div>'+
        '<div class="popconf-sub">Quer continuar neste modelo ou escolher outro?</div>'+
        '<div class="popconf-acts">'+
          '<button class="popconf-b1">Continuar neste modelo</button>'+
          '<button class="popconf-b2">Escolher outro modelo</button>'+
        '</div>'+
        '<button class="popconf-cart">🛒 Ver meu carrinho</button>'+
      '</div>';
    document.body.appendChild(ov);
    function fechar(){ try{ document.body.removeChild(ov); }catch(e){} }
    ov.addEventListener("click",function(e){ if(e.target===ov) fechar(); });
    ov.querySelector(".popconf-b1").onclick=function(){ fechar(); };                         // segue no mesmo produto
    ov.querySelector(".popconf-b2").onclick=function(){ fechar(); window.__fechar(); };        // fecha o produto → volta ao catálogo
    ov.querySelector(".popconf-cart").onclick=function(){ fechar(); window.__fechar(); abrirCarrinho(); };
  }

  // ---------- CARRINHO ----------
  function cnpjSalvo(){ try{ return localStorage.getItem("bt_cnpj")||""; }catch(e){ return ""; } }
  function hashStr(s){ var h=5381,i=s.length; while(i){ h=(h*33)^s.charCodeAt(--i); } return (h>>>0).toString(36); }
  function carregarCart(){ try{ return JSON.parse(localStorage.getItem("bt_carrinho")||"[]")||[]; }catch(e){ return []; } }
  function salvarCart(){ try{ localStorage.setItem("bt_carrinho", JSON.stringify(CART)); }catch(e){} }
  function cartQtd(){ return CART.reduce(function(s,i){return s+(Number(i.qtd)||0);},0); }
  function cartTotal(){ return CART.reduce(function(s,i){return s+(Number(i.qtd)||0)*(Number(i.preco)||0);},0); }
  function atualizarCartN(){ document.getElementById("cartN").textContent=cartQtd(); }
  function abrirCarrinho(){ renderCarrinho(); document.getElementById("cart").classList.add("show"); document.body.style.overflow="hidden"; }
  window.__fecharCart=function(){ document.getElementById("cart").classList.remove("show"); if(!document.getElementById("modal").classList.contains("show")) document.body.style.overflow=""; };
  function renderCarrinho(){
    var itens = CART.length? CART.map(function(it,ix){
      return '<div class="citem"><div class="d"><div class="nm">'+esc(it.nome)+'</div>'+
        '<div class="meta">'+esc(it.grupo?it.grupo+" · ":"")+esc(it.medida)+' · '+esc(it.corNome)+'</div>'+
        '<div class="l2"><div class="stepper" data-ix="'+ix+'"><button data-d="-1">−</button><input type="number" min="1" value="'+(Number(it.qtd)||0)+'"><button data-d="1">+</button></div>'+
        '<span class="sub">'+brl((Number(it.qtd)||0)*(Number(it.preco)||0))+'</span></div>'+
        '<button class="rm" data-rm="'+ix+'">remover</button></div></div>';
    }).join("") : '<div class="cvazio">Seu carrinho está vazio.<br>Escolha um produto e monte seu pedido.</div>';
    document.getElementById("cartPane").innerHTML=
      '<div class="ctopo"><h3 class="serif">🛒 Meu carrinho</h3><button class="fechar" onclick="__fecharCart()">✕</button></div>'+
      '<div class="itens">'+itens+'</div>'+
      '<div class="cfoot"><div class="tot"><span>Total</span><b>'+brl(cartTotal())+'</b></div>'+
      (CART.length?('<label style="display:block;font-size:15px;color:#555;margin:2px 0 8px">Informe o CNPJ da sua loja'+
        '<input id="cnpjInp" type="text" inputmode="numeric" autocomplete="off" placeholder="00.000.000/0000-00" value="'+esc(cnpjSalvo())+'" style="display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:12px;border:1px solid #d6d0c4;border-radius:10px;font-size:16px"></label>'+
        '<div id="cmsg" style="font-size:13px;margin:0 0 8px;min-height:1px;line-height:1.35"></div>'):'')+
      '<button class="fin" id="finalizar"'+(CART.length?"":" disabled")+'>'+(CART.length?"Finalizar pedido":"Finalizar pedido")+'</button></div>';
    var box=document.getElementById("cartPane");
    box.querySelectorAll(".citem .stepper").forEach(function(st){
      var ix=Number(st.getAttribute("data-ix")); var inp=st.querySelector("input");
      st.querySelectorAll("button").forEach(function(b){ b.onclick=function(){ var d=Number(b.getAttribute("data-d")); CART[ix].qtd=Math.max(1,(Number(CART[ix].qtd)||1)+d); salvarCart(); atualizarCartN(); renderCarrinho(); }; });
      inp.onchange=function(){ CART[ix].qtd=Math.max(1,Number(inp.value)||1); salvarCart(); atualizarCartN(); renderCarrinho(); };
    });
    box.querySelectorAll("[data-rm]").forEach(function(b){ b.onclick=function(){ CART.splice(Number(b.getAttribute("data-rm")),1); salvarCart(); atualizarCartN(); renderCarrinho(); }; });
    var fin=document.getElementById("finalizar"); if(fin) fin.onclick=finalizarPedido;
  }
  function finalizarPedido(){
    if(!CART.length) return;
    var btn=document.getElementById("finalizar"); var msg=document.getElementById("cmsg");
    var cnpjEl=document.getElementById("cnpjInp"); var cnpj=(cnpjEl&&cnpjEl.value||"").trim();
    var dig=cnpj.replace(/\D+/g,"");
    function erro(m){ if(msg){ msg.textContent=m; msg.style.color="#b91c1c"; } }
    if(dig.length<11){ erro("Digite o CNPJ (ou CPF) da sua loja para enviar o pedido."); if(cnpjEl) cnpjEl.focus(); return; }
    try{ localStorage.setItem("bt_cnpj", cnpj); }catch(e){}
    var itens=CART.map(function(it){ return {cod:it.cod, medida:it.medida, corNome:it.corNome, corId:it.corId, qtd:it.qtd, preco:it.preco, regiao:it.regiao, nome:it.nome, grupo:it.grupo}; });
    var idem=hashStr(dig+"|"+JSON.stringify(itens));
    if(msg){ msg.textContent=""; }
    btn.disabled=true; btn.textContent="Enviando…";
    fetch("/api/loja/pedido",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({cnpj:cnpj, itens:itens, idem:idem})})
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j||{}}; }); })
      .then(function(res){
        if(res.ok && res.j.ok){
          CART=[]; salvarCart(); atualizarCartN();
          var nome=res.j.cliente?(", "+esc(res.j.cliente)):"";
          document.getElementById("cartPane").innerHTML=
            '<div class="ctopo"><h3 class="serif">🛒 Meu carrinho</h3><button class="fechar" onclick="__fecharCart()">✕</button></div>'+
            '<div class="itens"><div class="cvazio" style="color:#166534;font-weight:600">✓ '+esc(res.j.msg||"Pedido enviado!")+'</div>'+
            '<div class="cvazio" style="font-weight:400">Obrigado'+nome+'! Qualquer dúvida, fale com a Big Tricot.</div></div>';
        } else {
          var m=res.j.msg||"Não consegui enviar o pedido agora. Tente novamente.";
          if(res.j.detalhe&&res.j.detalhe.length){ m+=" ("+res.j.detalhe.join("; ")+")"; }
          erro(m); btn.disabled=false; btn.textContent="Finalizar pedido";
        }
      })
      .catch(function(){ erro("Sem conexão no momento. Tente novamente."); btn.disabled=false; btn.textContent="Finalizar pedido"; });
  }

  document.getElementById("app").addEventListener("click",function(e){ var el=e.target.closest(".prod"); if(el) abrir(el.getAttribute("data-id")); });

  // ---------- ENTRADA / SESSÃO DO CLIENTE (CNPJ) ----------
  // A região de preço (Sul/Norte) vem do cadastro do cliente — o cliente NÃO escolhe.
  function cliSalvo(){ try{ return JSON.parse(localStorage.getItem("bt_cli")||"null"); }catch(e){ return null; } }
  function mostrarSaudacao(nome){
    var el=document.getElementById("saudacao"); if(!el) return;
    if(nome){ el.style.display="flex"; el.innerHTML='Olá, <b style="color:#fff">'+esc(nome)+'</b> · <a href="#" id="sairLoja" style="color:#e7a187;text-decoration:none">trocar</a>';
      var s=document.getElementById("sairLoja"); if(s) s.onclick=function(ev){ ev.preventDefault(); sairLoja(); };
    } else { el.style.display="none"; el.innerHTML=""; }
  }
  function aplicarSessao(nome,reg){
    regiao = (reg==="norte")?"norte":"sul";
    try{ localStorage.setItem("bt_cli", JSON.stringify({nome:nome||"", regiao:regiao})); }catch(e){}
    mostrarSaudacao(nome);
    document.getElementById("entrada").style.display="none";
    document.body.style.overflow="";
    render(); if(document.getElementById("modal").classList.contains("show")) renderDetalhe();
  }
  function abrirEntrada(){
    var ov=document.getElementById("entrada"); ov.style.display="flex"; document.body.style.overflow="hidden";
    var inp=document.getElementById("entCnpj"); if(inp && !inp.value) inp.value=cnpjSalvo();
    setTimeout(function(){ try{ inp.focus(); }catch(e){} },50);
  }
  function sairLoja(){ try{ localStorage.removeItem("bt_cli"); localStorage.removeItem("bt_cnpj"); }catch(e){} mostrarSaudacao(""); abrirEntrada(); }
  function entrarLoja(){
    var inp=document.getElementById("entCnpj"); var msg=document.getElementById("entMsg"); var btn=document.getElementById("entBtn");
    var cnpj=(inp&&inp.value||"").trim(); var dig=cnpj.replace(/\D+/g,"");
    if(dig.length<11){ msg.style.color="#b91c1c"; msg.textContent="Digite o CNPJ (ou CPF) da sua loja."; return; }
    msg.textContent=""; btn.disabled=true; btn.textContent="Entrando…";
    fetch("/api/loja/entrar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({cnpj:cnpj})})
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j||{}}; }); })
      .then(function(res){
        btn.disabled=false; btn.textContent="Entrar";
        if(res.ok && res.j.ok){ try{ localStorage.setItem("bt_cnpj", cnpj); }catch(e){} aplicarSessao(res.j.nome, res.j.regiao); }
        else { msg.style.color="#b91c1c"; msg.textContent=res.j.msg||"Não consegui validar o CNPJ. Tente novamente."; }
      })
      .catch(function(){ btn.disabled=false; btn.textContent="Entrar"; msg.style.color="#b91c1c"; msg.textContent="Sem conexão no momento. Tente novamente."; });
  }
  document.getElementById("entBtn").addEventListener("click",entrarLoja);
  document.getElementById("entCnpj").addEventListener("keydown",function(e){ if(e.key==="Enter") entrarLoja(); });

  atualizarCartN();
  renderBanner();
  render();

  // Inicia sessão: usa o que já está salvo pra mostrar rápido, e revalida no servidor.
  (function iniciarSessao(){
    var c=cliSalvo(); if(c && c.regiao){ regiao=(c.regiao==="norte")?"norte":"sul"; mostrarSaudacao(c.nome); }
    var dig=(cnpjSalvo()||"").replace(/\D+/g,"");
    if(dig.length>=11){
      fetch("/api/loja/entrar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({cnpj:cnpjSalvo()})})
        .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j||{}}; }); })
        .then(function(res){ if(res.ok && res.j.ok){ aplicarSessao(res.j.nome,res.j.regiao); } else { sairLoja(); } })
        .catch(function(){ /* offline: segue com o que estava salvo */ });
    } else { abrirEntrada(); }
  })();
})();
</script>

</html>
