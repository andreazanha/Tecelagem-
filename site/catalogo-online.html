<style>
  :root{--bg:#fff;--paper:#f7f5f1;--ink:#2a2723;--muted:#9c948a;--line:#ece6dd;--accent:#a8442e;--wpp:#25D366}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink);font-family:'Montserrat',sans-serif;-webkit-font-smoothing:antialiased}
  .serif{font-family:'Cormorant Garamond',serif}
  img{max-width:100%;display:block}
  .app{max-width:1160px;margin:0 auto;background:#fff;min-height:100vh}
  /* topo */
  .annc{background:#efece6;text-align:center;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#8a8177;padding:7px}
  .top{background:#fff;padding:16px;text-align:center;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .word{font-size:21px;letter-spacing:.06em;font-weight:500}
  /* capa */
  .capa{position:relative;height:min(72vh,560px);min-height:340px;background:linear-gradient(145deg,#efe7da,#ddd0bb);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
  .capa img{width:100%;height:100%;object-fit:cover}
  .capa .cap-ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,15,10,.34) 0%,rgba(0,0,0,.05) 30%,rgba(0,0,0,.05) 52%,rgba(30,22,16,.5) 100%)}
  .capa .cap-logo{position:absolute;top:22px;left:0;right:0;text-align:center;z-index:2}
  .capa .cap-logo img{height:46px;width:auto;display:inline-block}
  .capa .cap-tx{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:#fff;padding:0 16px}
  .capa .cap-tx .lb{font-size:10px;letter-spacing:.22em;text-transform:uppercase;opacity:.9}
  .capa .cap-tx .nm{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;line-height:1.05;margin-top:4px}
  /* nav */
  .nav{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:19}
  .nav a{flex:none;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#6f685e;text-decoration:none;font-weight:500;padding:7px 13px;border:1px solid var(--line);border-radius:999px;white-space:nowrap;cursor:pointer;user-select:none;transition:all .15s}
  .nav a:hover{border-color:var(--ink);color:var(--ink)}
  .nav a:active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .nav a.on{color:#fff;background:var(--ink);border-color:var(--ink)}
  .nav a.promo,.nav a.promo.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  /* No celular, mostra TODOS os botoes (quebra em linhas, sem rolar pro lado) */
  @media (max-width:820px){
    .nav{flex-wrap:wrap;justify-content:center;overflow-x:visible;gap:6px;padding:10px 10px}
    .nav a{font-size:10px;padding:6px 10px;letter-spacing:.05em}
  }
  /* secao */
  .sec{padding:26px 14px 8px}
  .sec h2{font-family:'Cormorant Garamond',serif;font-size:26px;text-align:center;font-weight:600}
  .sec .sc{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-align:center;margin-top:3px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding:16px 14px 8px}
  @media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
  .card{cursor:pointer;text-align:left}
  .card .ph{aspect-ratio:1/1;border-radius:6px;overflow:hidden;background:linear-gradient(145deg,#efe7da,#e2d7c4);display:flex;align-items:center;justify-content:center;font-size:26px;opacity:.9;position:relative}
  .card .ph img{width:100%;height:100%;object-fit:cover}
  .card .ofr{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;font-size:9px;font-weight:600;letter-spacing:.04em;padding:3px 7px;border-radius:3px}
  .card .selo{position:absolute;top:8px;left:8px;background:rgba(42,39,35,.85);color:#fff;font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:3px}
  .promo-badge{display:inline-block;background:var(--accent);color:#fff;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:4px 13px;border-radius:99px}
  .card .cn{font-weight:500;font-size:13px;margin-top:9px;color:#3a352f;line-height:1.25}
  .card .cf{font-size:9.5px;color:var(--muted);margin-top:4px;letter-spacing:.02em}
  .card .ct{font-size:10px;color:#8a8177;margin-top:3px;line-height:1.35}
  .card .cp{font-size:13.5px;color:var(--accent);font-weight:600;margin-top:1px}
  .card .cv{display:inline-flex;align-items:center;gap:4px;margin-top:7px;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:4px 11px}
  .card .cv .arw{transition:transform .15s}
  .card:hover .cv .arw{transform:translateX(2px)}
  /* detalhe (modal) */
  .ov{position:fixed;inset:0;background:rgba(20,16,12,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  @media(min-width:720px){.ov{align-items:center}}
  .sheet{background:#fff;width:100%;max-width:560px;max-height:94vh;overflow-y:auto;border-radius:20px 20px 0 0}
  @media(min-width:720px){.sheet{border-radius:16px}}
  .sheet .dtop{position:sticky;top:0;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);z-index:2}
  .sheet .dtop .x{font-size:22px;color:var(--ink);cursor:pointer;line-height:1;background:none;border:none}
  .dph{aspect-ratio:1/1;background:linear-gradient(145deg,#efe7da,#ddd0bb);display:flex;align-items:center;justify-content:center;font-size:44px;overflow:hidden}
  .dph img{width:100%;height:100%;object-fit:cover}
  .dbody{padding:18px 18px 30px}
  .dcat{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-align:center}
  .dname{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:27px;margin-top:4px;text-align:center;line-height:1.1}
  .dcomp{font-size:11.5px;color:var(--muted);text-align:center;margin-top:5px}
  .dnote{font-size:11.5px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.5}
  .lbl{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:20px 0 10px}
  .caract{margin-top:6px}
  .caract h4{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:15px 0 5px}
  .caract ul{list-style:none}
  .caract li{font-size:12px;color:#48433c;padding-left:13px;position:relative;line-height:1.55}
  .caract li::before{content:"";position:absolute;left:0;top:8px;width:3px;height:3px;border-radius:50%;background:var(--accent);opacity:.55}
  .sw{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .swi{display:flex;flex-direction:column;align-items:center;gap:4px;width:56px}
  .swi .chip{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);overflow:hidden}
  .swi .chip img{width:100%;height:100%;object-fit:cover}
  .swi small{font-size:8.5px;color:var(--muted);text-align:center;line-height:1.15}
  .gtitle{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);font-weight:600;margin:18px 0 6px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .szrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #f4efe7;font-size:12px}
  .szrow .n{color:var(--ink);line-height:1.4}
  .szrow .med{color:var(--muted);font-size:11px;margin-left:6px}
  .szrow .p{font-weight:600;color:var(--accent);font-size:14px;white-space:nowrap;flex:none}
  .szrow .p .was{display:block;font-size:10.5px;color:var(--muted);text-decoration:line-through;font-weight:400;text-align:right}
  .foot{text-align:center;padding:34px 16px 40px;color:var(--muted);font-size:11px;letter-spacing:.02em}
  .foot .fw{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--ink);letter-spacing:.06em}
  .load{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--muted)}
  .spin{width:34px;height:34px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
