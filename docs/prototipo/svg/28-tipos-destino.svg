t-size="15" fill="#fff" font-weight="bold" text-anchor="start">Big Tricot</text><text x="26" y="118" font-size="10.5" fill="#5b6478" font-weight="normal" text-anchor="start" letter-spacing="1">Cadastro</text><text x="34" y="153" font-size="13" fill="#7b8499" font-weight="normal" text-anchor="start">◧</text><text x="58" y="153" font-size="13.5" fill="#aeb6c7" font-weight="normal" text-anchor="start">Visão geral</text><rect x="14" y="172" width="202" height="38" rx="10" fill="#6366f11f"/><rect x="14" y="172" width="3" height="38" rx="2" fill="#818cf8"/><text x="34" y="197" font-size="13" fill="#c7d2fe" font-weight="normal" text-anchor="start">📦</text><text x="58" y="197" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start">Pedidos</text><text x="34" y="241" font-size="13" fill="#7b8499" font-weight="normal" text-anchor="start">🏭</text><text x="58" y="241" font-size="13.5" fill="#aeb6c7" font-weight="normal" text-anchor="start">Produção</text><text x="34" y="285" font-size="13" fill="#7b8499" font-weight="normal" text-anchor="start">📋</text><text x="58" y="285" font-size="13.5" fill="#aeb6c7" font-weight="normal" text-anchor="start">Romaneios</text><text x="34" y="329" font-size="13" fill="#7b8499" font-weight="normal" text-anchor="start">🧵</text><text x="58" y="329" font-size="13.5" fill="#aeb6c7" font-weight="normal" text-anchor="start">Costureiras</text><text x="34" y="373" font-size="13" fill="#7b8499" font-weight="normal" text-anchor="start">🗃️</text><text x="58" y="373" font-size="13.5" fill="#aeb6c7" font-weight="normal" text-anchor="start">Almoxarifado</text><text x="258" y="96" font-size="23" fill="#0f172a" font-weight="bold" text-anchor="start">Tipos de Pedido e Destino</text><text x="258" y="118" font-size="12" fill="#94a3b8" font-weight="normal" text-anchor="start">Pedidos  ›  Tipos &amp; Roteamento</text><text x="258" y="148" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">Ao gerar, o tipo define o destino de cada card. Parte 1/2 vão à Produção; Pronta Entrega e Estoque vão à página Estoque.</text><rect x="258" y="178" width="1202" height="110" rx="16" fill="#ffffff" stroke="#eef0f4" stroke-width="1" filter="url(#cardShadow)"/><rect x="258" y="178" width="250" height="110" rx="16" fill="url(#g_uni)"/><rect x="492" y="178" width="16" height="110" rx="0" fill="url(#g_uni)"/><text x="278" y="224" font-size="15" fill="#fff" font-weight="bold" text-anchor="start">Pedido Único</text><text x="278" y="248" font-size="11" fill="#ffffffcc" font-weight="normal" text-anchor="start">1 PDF</text><text x="532" y="216" font-size="9" fill="#94a3b8" font-weight="bold" text-anchor="start" letter-spacing="0.5">FLUXO</text><text x="532" y="238" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">Tecelagem → Passadoria → Corte → Costura → Revisão → Expedição → Transporte</text><text x="1438" y="216" font-size="9" fill="#94a3b8" font-weight="bold" text-anchor="end" letter-spacing="0.5">DESTINO</text><rect x="1348.0" y="228" width="90.0" height="26" rx="13" fill="#eef2ff"/><text x="1393.0" y="245" font-size="11.5" fill="#4338ca" font-weight="bold" text-anchor="middle">→ Produção</text><rect x="258" y="302" width="1202" height="110" rx="16" fill="#ffffff" stroke="#eef0f4" stroke-width="1" filter="url(#cardShadow)"/><rect x="258" y="302" width="250" height="110" rx="16" fill="url(#g_pp)"/><rect x="492" y="302" width="16" height="110" rx="0" fill="url(#g_pp)"/><text x="278" y="348" font-size="15" fill="#fff" font-weight="bold" text-anchor="start">Pedido Parte 1 e 2</text><text x="278" y="372" font-size="11" fill="#ffffffcc" font-weight="normal" text-anchor="start">2 PDFs (1 por parte)</text><text x="532" y="340" font-size="9" fill="#94a3b8" font-weight="bold" text-anchor="start" letter-spacing="0.5">FLUXO</text><text x="532" y="362" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">Tecelagem → Passadoria → (unem no Corte) → Costura → Revisão → Expedição → Transporte</text><text x="1438" y="340" font-size="9" fill="#94a3b8" font-weight="bold" text-anchor="end" letter-spacing="0.5">DESTINO</text><rect x="1348.0" y="352" width="90.0" height="26" rx="13" fill="#eef2ff"/><text x="1393.0" y="369" font-size="11.5" fill="#4338ca" font-weight="bold" text-anchor="middle">→ Produção</text><rect x="258" y="426" width="1202" height="110" rx="16" fill="#ffffff" stroke="#eef0f4" stroke-width="1" filter="url(#cardShadow)"/><rect x="258" y="426" width="250" height="110" rx="16" fill="url(#g_est)"/><rect x="492" y="426" width="16" height="110" rx="0" fill="url(#g_est)"/><text x="278" y="472" font-size="15" fill="#fff" font-weight="bold" text-anchor="start">Pedido Estoque</text><text x="278" y="496" font-size="11" fill="#ffffffcc" font-weight="normal" text-anchor="start">1 PDF (produção)</text><text x="532" y="464" font-size="9" fill="#94a3b8" font-weight="bold" text-anchor="start" letter-spacing="0.5">FLUXO</text><text x="532" y="486" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">Faz TODA a produção (igual Parte 1 e 2) e, no fim, dá entrada no Estoque</text><text x="1438" y="464" font-size="9" fill="#94a3b8" font-weight="bold" text-anchor="end" letter-spacing="0.5">DESTINO</text><rect x="1176.4" y="476" width="261.6" height="26" rx="13" fill="#fff7ed"/><text x="1307.2" y="493" font-size="11.5" fill="#b45309" font-weight="bold" text-anchor="middle">→ Estoque · «Dar entrada no estoque»</text><rect x="1076.4" y="476" width="90.0" height="26" rx="13" fill="#eef2ff"/><text x="1121.4" y="493" font-size="11.5" fill="#4338ca" font-weight="bold" text-anchor="middle">→ Produção</text><rect x="258" y="550" width="1202" height="110" rx="16" fill="#ffffff" stroke="#eef0f4" stroke-width="1" filter="url(#cardShadow)"/><rect x="258" y="550" width="250" height="110" rx="16" fill="url(#g_pej)"/><rect x="492" y="550" width="16" height="110" rx="0" fill="url(#g_pej)"/><text x="278" y="596" font-size="15" fill="#fff" font-weight="bold" text-anchor="start">P1 e 2 + Pronta Entrega — ENVIAR JUNTO</text><text x="278" y="620" font-size="11" fill="#ffffffcc" font-weight="normal" text-anchor="start">3 PDFs</text><text x="532" y="588" font-size="9" fill="#94a3b8" font-weight="bold" text-anchor="start" letter-spacing="0.5">FLUXO</text><text x="532" y="610" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">P1/P2 produzem · PE (não produz) aguarda e sai junto com o pedido</text><text x="1438" y="588" font-size="9" fill="#94a3b8" font-weight="bold" text-anchor="end" letter-spacing="0.5">DESTINO</text><rect x="1156.6" y="600" width="281.4" height="26" rx="13" fill="#fff7ed"/><text x="1297.3" y="617" font-size="11.5" fill="#b45309" font-weight="bold" text-anchor="middle">→ Estoque · «Pronta Entrega + Produção»</text><rect x="1056.6" y="600" width="90.0" height="26" rx="13" fill="#eef2ff"/><text x="1101.6" y="617" font-size="11.5" fill="#4338ca" font-weight="bold" text-anchor="middle">→ Produção</text><rect x="258" y="674" width="1202" height="110" rx="16" fill="#ffffff" stroke="#eef0f4" stroke-width="1" filter="url(#cardShadow)"/><rect x="258" y="674" width="250" height="110" rx="16" fill="url(#g_pes)"/><rect x="492" y="674" width="16" height="110" rx="0" fill="url(#g_pes)"/><text x="278" y="720" font-size="15" fill="#fff" font-weight="bold" text-anchor="start">P1 e 2 + Pronta Entrega — ENVIAR SEPARADO</text><text x="278" y="744" font-size="11" fill="#ffffffcc" font-weight="normal" text-anchor="start">3 PDFs</text><text x="532" y="712" font-size="9" fill="#94a3b8" font-weight="bold" text-anchor="start" letter-spacing="0.5">FLUXO</text><text x="532" y="734" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">P1/P2 produzem · PE (não produz) sai antes (antecipado)</text><text x="1438" y="712" font-size="9" fill="#94a3b8" font-weight="bold" text-anchor="end" letter-spacing="0.5">DESTINO</text><rect x="1275.4" y="724" width="162.6" height="26" rx="13" fill="#fff7ed"/><text x="1356