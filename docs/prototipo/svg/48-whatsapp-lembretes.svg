="552.0" y="675" font-size="9.5" fill="#8aa9a0" font-weight="normal" text-anchor="end">09:00 ✓✓</text><rect x="186.0" y="970" width="324" height="38" rx="19" fill="#2a3942"/><text x="206.0" y="994" font-size="12" fill="#8696a0" font-weight="normal" text-anchor="start">Mensagem</text><circle cx="556.0" cy="989" r="19" fill="#25d366"/><text x="556.0" y="994" font-size="14" fill="#0b141a" font-weight="normal" text-anchor="middle">➤</text><text x="380.0" y="1066" font-size="10.5" fill="#64748b" font-weight="normal" text-anchor="middle">A previsão de entrega é informada no momento de gerar o romaneio. 3 lembretes: véspera · manhã da entrega · e se atrasar.</text></svg>