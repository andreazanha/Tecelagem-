name: Desktop build (Windows)

# Compila o app desktop (Tauri) no Windows, ASSINA pra atualização automática e publica
# numa "prévia" (pre-release) com o manifesto latest.json. NÃO toca na produção: roda só no
# branch do desktop (o deploy Cloudflare só dispara no branch de produção/main).
on:
  push:
    branches:
      - claude/desktop-app
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências do desktop
        working-directory: desktop
        run: npm install

      - name: Compilar e ASSINAR o app (Tauri)
        working-directory: desktop
        env:
          # Chave que assina as atualizações (guardada nos Secrets do repositório).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build

      - name: Juntar arquivos + gerar o manifesto latest.json
        shell: bash
        run: |
          set -e
          mkdir -p dist-out

          # Executável portátil (roda sem instalar)
          if [ -f "desktop/src-tauri/target/release/big-tricot-desktop.exe" ]; then
            cp "desktop/src-tauri/target/release/big-tricot-desktop.exe" "dist-out/BigTricot-portatil.exe"
          fi

          # Instalador NSIS (cria ícone/atalho) — nome fixo pra o auto-update apontar certo
          SETUP="$(find desktop/src-tauri/target/release/bundle/nsis -name '*-setup.exe' | head -1)"
          cp "$SETUP" "dist-out/BigTricot-Setup.exe"

          # Assinatura gerada pelo Tauri (fica ao lado do instalador, com extensão .sig)
          SIG="$(cat "$SETUP.sig")"
          VER="$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")"
          URL="https://github.com/andreazanha/Tecelagem-/releases/download/desktop-preview/BigTricot-Setup.exe"

          cat > dist-out/latest.json <<JSON
          {
            "version": "$VER",
            "notes": "Atualização do aplicativo Big Tricot.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIG",
                "url": "$URL"
              }
            }
          }
          JSON

          echo "Arquivos gerados:" && ls -la dist-out && echo "--- latest.json ---" && cat dist-out/latest.json

      - name: Guardar como artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: big-tricot-desktop
          path: dist-out/*
          if-no-files-found: error

      - name: Publicar a prévia (com auto-update) pra download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete desktop-preview --yes --cleanup-tag 2>/dev/null || true
          gh release create desktop-preview dist-out/* \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Big Tricot Desktop — prévia de teste" \
            --notes "Versão de teste do app desktop, com **atualização automática**. Instale o **BigTricot-Setup.exe** (cria o ícone com o logo). 1ª vez: aviso de editor desconhecido → Mais informações → Executar assim mesmo. Precisa de internet. O sistema web continua normal."
