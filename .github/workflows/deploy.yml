name: Deploy (Cloudflare)

# Deploy automático a cada push na branch de trabalho (e manual pelo botão "Run workflow").
on:
  push:
    branches:
      - claude/rolagem-fase-architecture-s47d3e
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: |
          npm ci
          npm --prefix web ci

      - name: Build do frontend
        run: npm run build:web

      - name: Migrar banco, garantir catálogo e publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply DB --remote
          npx wrangler d1 execute DB --remote --file=./seed/catalogo.sql
          npx wrangler deploy
