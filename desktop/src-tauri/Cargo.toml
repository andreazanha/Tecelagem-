[package]
name = "big-tricot-desktop"
version = "0.1.0"
description = "Big Tricot — aplicativo desktop (Windows) que abre o sistema completo numa janela própria."
authors = ["Big Tricot"]
edition = "2021"
rust-version = "1.77.2"

# Biblioteca compartilhada entre o executável (main.rs) e o build do Tauri.
[lib]
name = "big_tricot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"

# Build de release menor e mais rápido de iniciar.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
