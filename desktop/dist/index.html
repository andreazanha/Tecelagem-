<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Big Tricot</title>
  <style>
    html,body{height:100%;margin:0}
    body{display:flex;align-items:center;justify-content:center;background:#17171b;color:#e8e8ea;
      font:600 15px system-ui,Segoe UI,Arial;flex-direction:column;gap:18px}
    .logo{width:92px;height:92px;border-radius:22px;background:#d8a24a;color:#17171b;
      display:flex;align-items:center;justify-content:center;font-weight:900;font-size:40px}
    .sp{width:26px;height:26px;border:3px solid #3a3a42;border-top-color:#d8a24a;border-radius:50%;
      animation:g 1s linear infinite}
    @keyframes g{to{transform:rotate(360deg)}}
    .muted{opacity:.7;font-weight:500;font-size:13px}
  </style>
</head>
<body>
  <div class="logo">BG</div>
  <div class="sp"></div>
  <div>Abrindo o Big Tricot…</div>
  <div class="muted">Se demorar, verifique a conexão com a internet.</div>
</body>
</html>
